<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#151324"><link rel="manifest" href="manifest.webmanifest"><title>LoveChat ❤️</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#100f1b;color:#fff;font:16px system-ui}main{max-width:620px;margin:auto;padding:16px}header{font-size:25px;font-weight:700;margin-bottom:12px}input,button{font:inherit;border-radius:12px;padding:12px}input{background:#29263a;border:1px solid #55516b;color:white;min-width:0}#email,#password{width:100%;margin:5px 0}button{background:#d65a9a;color:white;border:0;cursor:pointer}button:disabled{opacity:.5}.row{display:flex;gap:7px;align-items:center}.row input{flex:1;min-width:0}#messages{height:57dvh;min-height:260px;overflow:auto;display:flex;flex-direction:column;gap:9px;padding:12px 0}.bubble{padding:10px 13px;border-radius:16px;background:#302b43;max-width:85%;align-self:flex-start;overflow-wrap:anywhere}.mine{background:#873c70;align-self:flex-end}.time{display:block;font-size:11px;opacity:.65;margin-top:4px}.bubble img{display:block;max-width:240px;max-height:300px;width:auto;height:auto;border-radius:10px}.bubble video{display:block;max-width:230px;max-height:300px;border-radius:12px}.bubble video.circle{width:210px;height:210px;object-fit:cover;border-radius:50%}.bubble audio{display:block;width:min(240px,65vw)}small{color:#bcb4cb}#chat,#logout,#recording{display:none}.tools{margin:8px 0}.tools button{padding:10px 13px;background:#332b47}#status{min-height:22px;color:#e7b5d1;font-size:14px}#recording{background:#29263a;border-radius:14px;padding:12px;margin:8px 0}#preview{width:180px;height:180px;object-fit:cover;border-radius:50%;display:none;margin:8px auto}#recording button{margin-right:8px}#file{display:none}
</style></head><body><main><header>❤️ LoveChat</header>
<section id="login"><p>Вход в ваш личный чат</p><input id="email" type="email" placeholder="Почта" autocomplete="email"><input id="password" type="password" placeholder="Пароль" autocomplete="current-password"><button id="signin">Войти</button><p><small>Аккаунты создаются владельцем проекта. Не вводите пароль Supabase Dashboard.</small></p></section>
<button id="logout">Выйти</button>
<section id="chat"><div id="messages"></div><div class="row tools"><button type="button" id="photo" title="Отправить фото">📸 Фото</button><button type="button" id="voice" title="Записать голосовое">🎤 ГС</button><button type="button" id="circle" title="Записать видеокружочек">⭕ Кружок</button></div><input type="file" id="file" accept="image/*"><div id="recording"><div id="recordLabel"></div><video id="preview" autoplay muted playsinline></video><button type="button" id="stopRecord">⏹ Завершить и отправить</button><button type="button" id="cancelRecord">Отмена</button></div><form id="send" class="row"><input id="message" placeholder="Сообщение…" maxlength="2000" required><button type="submit">➤</button></form></section><p id="status" role="status"></p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="config.js"></script><script>
const $=id=>document.getElementById(id);let client,me,channel,recorder,stream,recordKind,recordParts=[],cancelled=false,loading=false;const status=s=>$('status').textContent=s;const cfg=window.LOVECHAT_CONFIG||{};
if(!cfg.url||!cfg.anonKey||cfg.anonKey.includes('PASTE_')){status('Заполни config.js: адрес проекта и publishable key.');$('signin').disabled=true;}else{client=supabase.createClient(cfg.url,cfg.anonKey);client.auth.onAuthStateChange((_event,session)=>{setTimeout(()=>show(session?.user),0)});client.auth.getUser().then(({data})=>show(data.user)).catch(()=>status('Не удалось подключиться к серверу.'));}
async function show(user){me=user;$('login').style.display=user?'none':'block';$('chat').style.display=user?'block':'none';$('logout').style.display=user?'inline-block':'none';if(channel){await client.removeChannel(channel);channel=null;}if(!user)return;await load();channel=client.channel('messages-live').on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},()=>load()).subscribe();}
async function load(){if(!me||loading)return;loading=true;try{const {data,error}=await client.from('messages').select('id,user_id,text,created_at,media_path,media_type').order('created_at',{ascending:true}).limit(300);if(error)throw error;const list=$('messages');list.replaceChildren();for(const m of data){const div=document.createElement('div');div.className='bubble'+(m.user_id===me.id?' mine':'');if(m.text)div.append(document.createTextNode(m.text));if(m.media_path&&['image','audio','video'].includes(m.media_type)){const {data:link,error:linkError}=await client.storage.from('chat-media').createSignedUrl(m.media_path,3600);if(linkError){const span=document.createElement('span');span.textContent='Файл недоступен';div.append(span);}else{let el;if(m.media_type==='image'){el=document.createElement('img');el.alt='Фотография';el.loading='lazy';el.onclick=()=>window.open(link.signedUrl,'_blank');}else if(m.media_type==='audio'){el=document.createElement('audio');el.controls=true;el.preload='none';}else{el=document.createElement('video');el.controls=true;el.playsInline=true;el.preload='metadata';el.className='circle';}el.src=link.signedUrl;div.append(el);}}const time=document.createElement('span');time.className='time';time.textContent=new Date(m.created_at).toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'});div.append(time);list.append(div);}list.scrollTop=list.scrollHeight;status('');}catch(e){status('Ошибка чтения: '+e.message)}finally{loading=false;}}
$('signin').onclick=async()=>{status('Входим…');const {error}=await client.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});status(error?'Ошибка входа: '+error.message:'');};$('logout').onclick=()=>client.auth.signOut();
$('send').onsubmit=async e=>{e.preventDefault();const value=$('message').value.trim();if(!value||!me)return;$('message').value='';const {error}=await client.from('messages').insert({user_id:me.id,text:value});if(error){status('Ошибка отправки: '+error.message);$('message').value=value;}else await load();};
async function upload(blob,kind){if(!me)return;const ext=kind==='image'?(blob.type.includes('png')?'png':blob.type.includes('heic')?'heic':blob.type.includes('webp')?'webp':'jpg'):blob.type.includes('mp4')?'mp4':'webm';const path=me.id+'/'+crypto.randomUUID()+'.'+ext;status('Загружаем файл…');const {error:upError}=await client.storage.from('chat-media').upload(path,blob,{contentType:blob.type||'application/octet-stream',upsert:false});if(upError){status('Ошибка загрузки: '+upError.message);return;}const {error}=await client.from('messages').insert({user_id:me.id,text:'',media_path:path,media_type:kind});if(error){await client.storage.from('chat-media').remove([path]);status('Ошибка отправки: '+error.message);return;}await load();}
$('photo').onclick=()=>$('file').click();$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;e.target.value='';if(!f.type.startsWith('image/')){status('Выбери фотографию');return;}if(f.size>50*1024*1024){status('Фото должно быть меньше 50 МБ');return;}await upload(f,'image');};
async function startRecord(kind){if(!window.MediaRecorder||!navigator.mediaDevices?.getUserMedia){status('Запись не поддерживается этим браузером');return;}if(recorder&&recorder.state!=='inactive')return;try{stream=await navigator.mediaDevices.getUserMedia(kind==='video'?{audio:true,video:{facingMode:'user'}}:{audio:true});recordKind=kind;recordParts=[];cancelled=false;const opts={};const types=kind==='video'?['video/mp4','video/webm;codecs=vp8,opus','video/webm']:['audio/mp4','audio/webm;codecs=opus','audio/webm'];for(const type of types){if(MediaRecorder.isTypeSupported(type)){opts.mimeType=type;break;}}recorder=new MediaRecorder(stream,opts);recorder.ondataavailable=e=>{if(e.data.size)recordParts.push(e.data);};recorder.onstop=async()=>{stream?.getTracks().forEach(t=>t.stop());$('preview').srcObject=null;$('preview').style.display='none';$('recording').style.display='none';if(cancelled)return;const blob=new Blob(recordParts,{type:recorder.mimeType||recordParts[0]?.type||'application/octet-stream'});if(blob.size>50*1024*1024){status('Запись больше 50 МБ. Попробуй короче.');return;}if(blob.size)await upload(blob,recordKind);};$('recording').style.display='block';$('recordLabel').textContent=kind==='video'?'⭕ Записывается видеокружок…':'🎤 Записывается голосовое…';$('preview').style.display=kind==='video'?'block':'none';if(kind==='video'){$('preview').srcObject=stream;await $('preview').play().catch(()=>{});}recorder.start();status('');}catch(e){stream?.getTracks().forEach(t=>t.stop());status('Не удалось включить камеру/микрофон: '+e.message);}}
$('voice').onclick=()=>startRecord('audio');$('circle').onclick=()=>startRecord('video');$('stopRecord').onclick=()=>{if(recorder?.state==='recording')recorder.stop();};$('cancelRecord').onclick=()=>{cancelled=true;if(recorder?.state==='recording')recorder.stop();};
</script></body></html>
